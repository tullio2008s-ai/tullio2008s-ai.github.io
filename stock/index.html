<script>
/* ============ Utilità ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={

};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||''}</svg>`;

const dmy=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return s||'';const[y,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+y};
const num=v=>{if(typeof v==='number')return v;const s=String(v??'').trim().replace(/\s/g,'');if(!s)return NaN;return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)};
const fmt=(v,min=2,max=2)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('it-IT',{minimumFractionDigits:min,maximumFractionDigits:max});
const oldDays=s=>s&&/^\d{4}-\d{2}-\d{2}/.test(s)?Math.floor((Date.now()-new Date(s.slice(0,10)+'T12:00:00'))/864e5):0;

  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});

/* ============ API ============ */
let TOKEN=null;try{TOKEN=sessionStorage.getItem('cc_tok')}catch(e){}
const API_URL=window.__API_URL||'';
function sessionLost(){TOKEN=null;try{sessionStorage.removeItem('cc_tok')}catch(x){}showLogin();return new Error('Sessione scaduta: accedi di nuovo.')}
function call(fn,...args){
  if(window.__MOCKCALL)return window.__MOCKCALL(fn,args);
  if(API_URL){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
      .then(r=>r.json()).then(j=>{if(j.ok)return j.data;if(/SESSIONE_SCADUTA/.test(j.error||''))throw sessionLost();throw new Error(j.error||'Errore')})
      .catch(e=>{if(e instanceof TypeError)throw new Error('Connessione non riuscita: riprova tra un momento.');throw e});
  }
  return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>{const m=(e&&e.message)||String(e);/SESSIONE_SCADUTA/.test(m)?rej(sessionLost()):rej(new Error(m.replace(/^Error:\s*/,'')))})[fn](...args));
}
const api=(fn,...a)=>call(fn,TOKEN,...a);

const S={me:null,fatture:[],acquisti:[],prodotti:[],trasporti:[],tr:null,imp:{cambioUSD:'1.10',criterio:'ultimo',tariffaOraria:'0',energiaKwh:'0',fissiPct:'0',modello:''},apiKeyOk:false,
  tab:'listino',q:'',fForn:'',fVal:'',sort:{k:'nome',d:1},qf:'',queue:[],draft:null,prodId:null,pEdit:null,pDirty:false,pq:''};
let LIST=[],LMAP={};
const cambio=a=>a.valuta==='EUR'?1:(Number(a.cambio)||Number(S.imp.cambioUSD)||0);

const FX={rate:null,date:'',err:''};
async function getFx(force){ // cambio BCE EUR/USD (USD per 1 €), ultimo disponibile
  if(FX.rate&&!force)return FX;
  try{const j=await fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD',{cache:'no-store'}).then(r=>r.json());
    if(j&&j.rates&&j.rates.USD){FX.rate=Number(j.rates.USD);FX.date=j.date;FX.err=''}else FX.err='cambio non disponibile'}catch(e){FX.err='cambio non disponibile'}
  return FX}
const fxNow=()=>FX.rate||Number(S.imp.cambioUSD)||1;
const eurOf=a=>a.valuta==='EUR'?a.prezzo:(a.valuta==='USD'&&cambio(a)>0?a.prezzo/cambio(a):null);
const compKey=a=>norm(a.fornitore)+'|'+norm(a.codice||a.nome);
function buildListino(){
  const m=new Map();
  S.acquisti.forEach((a,i)=>{const k=compKey(a);if(!m.has(k))m.set(k,{key:k,rows:[]});const e=eurOf(a),tr=a.traspIncl==='SI'?0:(Number(a.trasporto)||0);m.get(k).rows.push({...a,_i:i,eur:e,tr,land:e==null?null:e+tr})});
  LIST=[...m.values()].map(c=>{
    c.rows.sort((x,y)=>(y.data||'').localeCompare(x.data||'')||y._i-x._i);
    const l=c.rows[0],p=c.rows[1];
    Object.assign(c,{fornitore:l.fornitore,codice:l.codice,nome:l.nome||l.codice,descrizione:l.descrizione||(c.rows.find(r=>r.descrizione)||{}).descrizione||'',unita:l.unita,
      last:l,prev:p||null,eurLast:l.eur,data:l.data,n:c.rows.length});
    const es=c.rows.filter(r=>r.eur!=null);
    c.eurMin=es.length?Math.min(...es.map(r=>r.eur)):null;c.eurMax=es.length?Math.max(...es.map(r=>r.eur)):null;
    const q=es.reduce((s,r)=>s+(r.qta||1),0);c.eurAvg=q?es.reduce((s,r)=>s+r.eur*(r.qta||1),0)/q:null;
    const ls=c.rows.filter(r=>r.land!=null);
    c.landLast=l.land;c.trLast=l.tr;c.landMin=ls.length?Math.min(...ls.map(r=>r.land)):null;c.landMax=ls.length?Math.max(...ls.map(r=>r.land)):null;
    const ql=ls.reduce((s,r)=>s+(r.qta||1),0);c.landAvg=ql?ls.reduce((s,r)=>s+r.land*(r.qta||1),0)/ql:null;c.trAvg=ql?ls.reduce((s,r)=>s+r.tr*(r.qta||1),0)/ql:0;
    const rm=ls.reduce((b,r)=>!b||r.land<b.land?r:b,null);c.trMin=rm?rm.tr:0;
    c.var=(p&&l.eur!=null&&p.eur!=null&&p.eur>0)?(l.eur-p.eur)/p.eur:null;
    return c});
  LMAP=Object.fromEntries(LIST.map(c=>[c.key,c]));
}
const costOf=c=>!c?null:S.imp.criterio==='medio'?c.landAvg:S.imp.criterio==='minimo'?c.landMin:c.landLast; // costo LANDED (EXW + trasporto)
const trOf=c=>!c?0:S.imp.criterio==='medio'?c.trAvg:S.imp.criterio==='minimo'?c.trMin:c.trLast;
const CRIT={ultimo:'ultimo prezzo',medio:'prezzo medio ponderato',minimo:'prezzo minimo'};
const suppliers=()=>[...new Set([...S.fatture.map(f=>f.fornitore),...S.acquisti.map(a=>a.fornitore)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const supplierMatch=n=>{const k=norm(n);return suppliers().find(s=>norm(s)===k)||String(n||'').trim()};
function lineCost(l){ // costo unitario EUR di una riga distinta
  if(l.k==='free')return {u:Number(l.costo)||0,tr:0,info:'riga libera',warn:false};
  const c=LMAP[l.key];if(!c)return {u:0,tr:0,info:'non più in listino',warn:true};
  const u=costOf(c);return {u:u||0,tr:trOf(c)||0,info:dmy(c.data)+' · '+c.fornitore,warn:u==null,c};
}
function prodTotals(p){ // conto economico: materiali + variabili + lavoro + quota fissi = costo prodotto
  const mat=p.bom.reduce((s,l)=>s+lineCost(l).u*(Number(l.qta)||0),0);
  const trasp=p.bom.reduce((s,l)=>s+lineCost(l).tr*(Number(l.qta)||0),0);
  const va=(p.variabili||[]).reduce((s,l)=>s+(Number(l.qta)||0)*(Number(l.costo)||0),0);
  const lav=p.lavoro.reduce((s,l)=>s+(Number(l.ore)||0)*(Number(l.tariffa)||0),0);
  const base=mat+va+lav;
  const fis=(p.fissi||[]).reduce((s,l)=>s+(l.tipo==='pct'?base*(Number(l.val)||0)/100:(Number(l.val)||0)),0);
  const tot=base+fis,pv=p.prezzoVendita===''||p.prezzoVendita==null?null:Number(p.prezzoVendita);
  const mar=pv!=null&&!isNaN(pv)?pv-tot:null;
  return {mat,trasp,va,lav,fis,base,tot,pv,mar,marPct:mar!=null&&pv>0?mar/pv:null,ric:mar!=null&&tot>0?mar/tot:null};
}

async function reload(){
  const d=await api('api_state');
  Object.assign(S,{me:d.me,fatture:d.fatture,acquisti:d.acquisti,prodotti:d.prodotti,trasporti:d.trasporti||[],imp:d.imp,apiKeyOk:d.apiKeyOk});
  buildListino();
}
async function boot(){
  if(STOCK_ONLY){await loadStock(true);S.me=S.stock.me}else{getFx();await reload()}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#me-nome').textContent=S.me.nome;$('#me-ruolo').textContent=S.me.ruolo==='admin'?'Amministratore':'Utente';
  $('#me-av').textContent=(S.me.nome||'?').trim().slice(0,2).toUpperCase();
  render();
}

    ...lFiltered().map(c=>[c.fornitore,c.codice,c.nome,c.descrizione,c.unita,c.last.valuta,cn(c.last.prezzo),cn(c.eurLast),cn(c.last.trasporto),c.last.traspIncl==='SI'?'SI':'NO',cn(c.landLast),cn(c.landAvg),cn(c.landMin),cn(c.landMax),dmy(c.data),c.n])],'listino_componenti.csv');

function lFiltered(){
  const t=norm(S.q).split(' ').filter(Boolean);
  let a=LIST.filter(c=>(!S.fForn||c.fornitore===S.fForn)&&(!S.fVal||c.rows.some(r=>r.valuta===S.fVal))&&(!t.length||t.every(w=>norm([c.codice,c.nome,c.descrizione,c.fornitore].join(' ')).includes(w))));
  const k=S.sort.k,d=S.sort.d,g={nome:c=>norm(c.nome),codice:c=>norm(c.codice),fornitore:c=>norm(c.fornitore),eur:c=>c.eurLast??-1,land:c=>c.landLast??-1,data:c=>c.data||'',var:c=>c.var??-99,n:c=>c.n}[k];
  return a.sort((x,y)=>{const u=g(x),v=g(y);return (u>v?1:u<v?-1:0)*d});
}
function lTab(){
  const a=lFiltered(),col=(k,l,cls='')=>`<th class="s ${cls}" data-k="${k}">${l}${S.sort.k===k?(S.sort.d>0?' ▲':' ▼'):''}</th>`;

    <td><b>${esc(c.nome)}</b>${c.descrizione?`<div class="mut" style="font-size:12.5px">${esc(c.descrizione)}</div>`:''}</td><td>${esc(c.fornitore)}</td>
    <td class="r nw"><b>${eurP(c.eurLast)}</b>${l.valuta==='USD'?`<div class="mut" style="font-size:11.5px">${money(l.prezzo,'USD')} <span class="chip usd">USD</span></div>`:''}</td>
    <td class="r nw ed"><input class="tr-in" data-id="${l.id}" value="${l.trasporto==null?'':esc(String(Math.round(l.trasporto*10000)/10000).replace('.',','))}" placeholder="0,00" ${inc?'disabled title="Trasporto già incluso nel prezzo"':''}></td>
    <td class="ed" style="text-align:center"><input type="checkbox" class="tr-ck" data-id="${l.id}" ${inc?'checked':''} title="Trasporto incluso SI/NO"></td>
    <td class="r nw">${c.trLast>0?`<span class="land">${eurP(c.landLast)}</span>`:`<b>${eurP(c.landLast)}</b>`}</td>
    <td class="r">${c.var==null?'<span class="mut">—</span>':`<span class="chip ${c.var>0.0005?'up':c.var<-0.0005?'dn':''}">${c.var>0?'+':''}${fmt(c.var*100,1,1)}%</span>`}</td>
    <td class="nw">${dmy(c.data)}${oldChip(c.data)}</td><td class="r">${c.n}</td></tr>`}).join('')}</tbody></table>${a.length>500?`<div class="empty">Mostrati i primi 500 su ${a.length}: affina la ricerca.</div>`:''}`
    :`<div class="empty">${LIST.length?'Nessun componente corrisponde alla ricerca.':'Il listino è vuoto: carica le prime fatture dalla sezione “Carica fatture”.'}</div>`;
  $$('#l-tab th.s').forEach(h=>h.onclick=()=>{const k=h.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};lTab()});

    const v=tr.value.trim()===''?null:num(tr.value);if(v!=null&&(isNaN(v)||v<0)){toast('Costo trasporto non valido.',true);return}
    try{await api('api_saveAcquisto',{...a,trasporto:el.classList.contains('tr-in')?v:a.trasporto,traspIncl:ck.checked?'SI':'NO'});await reload();lTab();toast('Trasporto aggiornato.')}catch(e){toast(e.message,true)}};
  $$('#l-tab .tr-in,#l-tab .tr-ck').forEach(el=>el.onchange=()=>saveTr(el));
}

  $('#modals').appendChild(w);return w}
const closeX=w=>$$('.x',w).forEach(b=>b.onclick=()=>w.remove());

    ${c.rows.map(r=>{const f=S.fatture.find(x=>x.id===r.fatturaId);return `<tr><td class="nw">${dmy(r.data)}${oldChip(r.data)}</td><td>${f?esc(f.numero||'s.n.')+(f.fileUrl?` <a href="${esc(f.fileUrl)}" target="_blank" rel="noopener">documento</a>`:''):'<span class="mut">inserito a mano</span>'}</td>

const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Lettura file non riuscita.'));r.readAsDataURL(f)});
async function prepFile(f){
  if(f.size>10*1024*1024)throw new Error('File oltre 10 MB.');
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return {mime:'application/pdf',b64:await readB64(f),name:f.name};
  if(/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)){
    if(typeof XLSX==='undefined')throw new Error('Lettore Excel non caricato: ricarica la pagina.');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];Object.keys(ws).forEach(k=>{const c=ws[k];if(c&&c.t==='d'&&c.v instanceof Date){const d=new Date(c.v.getTime()+12*36e5);c.w=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}})});
    const text=wb.SheetNames.map(n=>{const c=XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:'\t',blankrows:false,dateNF:'yyyy-mm-dd'});return c.replace(/[\t\n\s]/g,'')?'### Foglio: '+n+'\n'+c:''}).filter(Boolean).join('\n\n');
    if(!text)throw new Error('Il file Excel è vuoto.');
    const mime=/\.csv$/i.test(f.name)?'text/csv':/\.xls$/i.test(f.name)?'application/vnd.ms-excel':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    return {mime,b64:await readB64(f),name:f.name,text};
  }
  if(!/^image\//.test(f.type))throw new Error('Formato non supportato (usa PDF, immagini, Excel o CSV).');
  let bmp;try{bmp=await createImageBitmap(f)}catch(e){throw new Error('Immagine non leggibile (HEIC non supportato: usa JPG/PNG).')}
  const sc=Math.min(1,2400/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
  const b64=cv.toDataURL('image/jpeg',0.9).split(',')[1];return {mime:'image/jpeg',b64,name:f.name.replace(/\.\w+$/,'')+'.jpg'};
}
async function addFiles(fs){
  fs=fs.filter(f=>f&&f.size!==undefined);if(!fs.length)return;
  const items=fs.map(f=>({id:'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:f.name||'file',st:'run',f}));
  S.queue.unshift(...items);drawQueue();
  for(const q of items){ // in sequenza: evita sovraccarichi sul backend
    try{
      const p=await prepFile(q.f);delete q.f;
      const r=await api('api_extract',p.name,p.mime,p.b64,p.text||'');
      await getFx();q.draft=draftFrom(r);q.st='review';
    }catch(e){q.st='err';q.err=e.message;delete q.f}
    drawQueue();
  }
  const n=items.filter(q=>q.st==='review').length;if(n)toast(n+(n>1?' fatture pronte':' fattura pronta')+' da verificare.');
}
function draftFrom(r){
  const x=r.extracted||{},cur=String(x.valuta||'EUR').toUpperCase(),okc=cur==='USD'?'USD':'EUR';
  let warn=r.warning||'';if(x.valuta&&cur!=='EUR'&&cur!=='USD')warn+=(warn?' ':'')+`Valuta “${cur}” non gestita: impostata EUR, controlla i prezzi.`;
  if(x.note)warn+=(warn?' ':'')+x.note;
  return {data:/^\d{4}-\d{2}-\d{2}$/.test(x.data_fattura||'')?x.data_fattura:todayYmd(),numero:x.numero_fattura||'',fornitore:supplierMatch(x.fornitore||''),
    valuta:okc,cambio:okc==='USD'?String(fxNow()):'',imponibile:x.imponibile_totale==null?'':x.imponibile_totale,
    fileId:r.fileId,fileUrl:r.fileUrl,fileName:r.fileName,warning:warn,tmode:(x.righe||[]).some(l=>l.tipo==='spese')?'pezzi':'no',
    righe:(x.righe||[]).map(l=>({inc:l.tipo!=='spese',tipo:l.tipo||'merce',codice:l.codice||'',nome:l.nome||'',descrizione:l.descrizione||'',qta:String(l.quantita??1),unita:l.unita||'',
      prezzo:l.prezzo_unitario==null?'':String(l.prezzo_unitario),totEst:l.totale_riga}))
  };
}

function rFatture(){
  const n=a=>S.acquisti.filter(x=>x.fatturaId===a.id);
  head('Fatture caricate',`${S.fatture.length} documenti · clic su una riga per rivederla o correggerla`);
  const tot=f=>n(f).reduce((s,a)=>s+a.qta*a.prezzo,0);
  const fs=[...S.fatture].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  $('#view').innerHTML=`<div class="tools"><div class="search">${ic('search')}<input id="f-q" placeholder="Cerca fornitore o numero…" value="${esc(S.qf)}"></div></div><div class="card tw"><div id="f-tab"></div></div>`;
  const draw=()=>{const t=norm(S.qf);const a=fs.filter(f=>!t||norm(f.fornitore+' '+f.numero).includes(t));
    $('#f-tab').innerHTML=a.length?`<table><thead><tr><th>Data</th><th>Fornitore</th><th>N. fattura</th><th class="r">Righe</th><th class="r">Totale righe</th><th>Documento</th></tr></thead><tbody>${a.map(f=>`<tr class="click" data-id="${f.id}"><td class="nw">${dmy(f.data)}</td><td><b>${esc(f.fornitore)}</b></td><td>${esc(f.numero)||'<span class="mut">—</span>'}</td><td class="r">${n(f).length}</td><td class="r nw">${money(tot(f),f.valuta)}${f.valuta==='USD'?`<div class="mut" style="font-size:11.5px">= ${eur(tot(f)/(Number(f.cambio)||fxNow()))} (cambio ${fmt(Number(f.cambio)||fxNow(),2,4)})</div>`:''}</td><td>${f.fileUrl?`<a href="${esc(f.fileUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apri</a>`:'<span class="mut">—</span>'}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Nessuna fattura${S.qf?' trovata':' caricata'}.</div>`;
    $$('#f-tab tr.click').forEach(r=>r.onclick=()=>{const f=S.fatture.find(x=>x.id===r.dataset.id);
      openDraft({id:f.id,data:f.data,numero:f.numero,fornitore:f.fornitore,valuta:f.valuta,cambio:f.cambio||'',imponibile:f.imponibile==null?'':f.imponibile,fileId:f.fileId,fileUrl:f.fileUrl,fileName:f.fileName,warning:'',
        righe:n(f).map(a=>({inc:true,tipo:'merce',codice:a.codice,nome:a.nome,descrizione:a.descrizione,qta:String(a.qta),unita:a.unita,prezzo:String(a.prezzo),trasporto:a.trasporto,traspIncl:a.traspIncl,traspId:a.traspId}))},null)})};
  $('#f-q').oninput=e=>{S.qf=e.target.value;draw()};draw();
}

/* ============ TRASPORTI ============ */
const newTr=()=>({id:'',descrizione:'',fornitore:'',fatturaId:'',data:todayYmd(),costo:'',valuta:'EUR',cambio:'',pezzi:'',metodo:'pezzi'});
const evalNum=s=>{let v=num(s);if(!isNaN(v))return v;const t=String(s||'').trim().replace(/,/g,'.');if(!t||!/^[0-9+\-*\/().\s]+$/.test(t))return NaN;try{v=Function('"use strict";return ('+t+')')()}catch(e){return NaN}return isFinite(v)?v:NaN};
function rTrasporti(){
  if(!S.tr)S.tr=newTr();const t=S.tr;
  const nrow=id=>S.acquisti.filter(a=>a.traspId===id).length;
  head('TRASPORTI','Costo unitario trasporto = Costo trasporto ÷ Numero pezzi · poi lo assegni ai componenti del listino (Trasporto incluso SI/NO)');
  $('#view').innerHTML=`
  <div class="card pad"><div class="sec" style="margin-top:0"><span>${t.id?'Modifica spedizione':'Nuova spedizione'}</span></div>
   <div class="calc">
    <label class="f">Riferimento<input id="t-des" value="${esc(t.descrizione)}" placeholder="es. Spedizione CL168 ottobre"></label>
    <label class="f">Fornitore<input id="t-for" list="dl-for" value="${esc(t.fornitore)}"></label>
    <label class="f">Data<input id="t-dat" type="date" value="${esc(t.data)}"></label>
    <label class="f">Fattura collegata<select id="t-fat"><option value="">— nessuna —</option>${[...S.fatture].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(f=>`<option value="${f.id}" ${t.fatturaId===f.id?'selected':''}>${esc(f.fornitore)} · ${esc(f.numero||'s.n.')} · ${dmy(f.data)}</option>`).join('')}</select></label>
   </div>
   <div class="calc" style="margin-top:12px">
    <label class="f">Costo trasporto «XX»<input id="t-cos" value="${esc(String(t.costo).replace('.',','))}" placeholder="es. 575  oppure  500+75"></label>
    <label class="f">Valuta<select id="t-val"><option ${t.valuta==='EUR'?'selected':''}>EUR</option><option ${t.valuta==='USD'?'selected':''}>USD</option></select></label>
    <label class="f" id="t-cw">Cambio (USD per 1 €)<input id="t-cam" value="${esc(t.cambio||S.imp.cambioUSD)}"></label>
    <label class="f">Numero pezzi «YY»<input id="t-pez" value="${esc(String(t.pezzi).replace('.',','))}" placeholder="es. 330"></label>
   </div>
   <datalist id="dl-for">${suppliers().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
   <div class="res" id="t-res"></div>
   <div class="tools" style="margin:16px 0 0"><button class="btn p" id="t-save">Salva spedizione</button><button class="btn y" id="t-apply">Salva e assegna ai componenti…</button>${t.id?'<button class="btn" id="t-new">Nuova</button>':''}</div>
  </div>
  <div class="sec"><span>Spedizioni salvate</span></div><div class="card tw"><div id="t-tab"></div></div>`;
  const rd=()=>{t.descrizione=$('#t-des').value;t.fornitore=$('#t-for').value;t.data=$('#t-dat').value;t.fatturaId=$('#t-fat').value;t.costo=$('#t-cos').value;t.valuta=$('#t-val').value;t.cambio=$('#t-cam').value;t.pezzi=$('#t-pez').value};
  const calc=()=>{const c=evalNum(t.costo),p=evalNum(t.pezzi),cam=t.valuta==='USD'?(num(t.cambio)||Number(S.imp.cambioUSD)||0):1,u=c>0&&p>0&&cam>0?c/cam/p:NaN;
    $('#t-cw').classList.toggle('hide',t.valuta==='EUR');
    $('#t-res').innerHTML=`<div class="f">Costo trasporto<br><b style="font-size:21px;color:#fff">${isNaN(c)?'—':fmt(c)+(t.valuta==='USD'?' $':' €')}</b></div><div class="x" style="font-size:24px">÷</div><div class="f">Numero pezzi<br><b style="font-size:21px;color:#fff">${isNaN(p)?'—':fmt(p,0,3)}</b></div><div class="x" style="font-size:24px">=</div><div class="f">Costo unitario trasporto<br><b>${isNaN(u)?'—':fmt(u,2,4)+' €'}</b></div>`;return {c,p,u}};
  ['t-des','t-for','t-dat','t-cos','t-cam','t-pez'].forEach(id=>$('#'+id).oninput=()=>{rd();calc()});$('#t-val').onchange=()=>{rd();calc()};
  $('#t-fat').onchange=()=>{rd();const f=S.fatture.find(x=>x.id===t.fatturaId);if(f){t.fornitore=f.fornitore;t.valuta=f.valuta;t.cambio=f.cambio||'';t.data=f.data;if(!t.descrizione.trim())t.descrizione='Trasporto fattura '+(f.numero||'s.n.');
    if(!String(t.pezzi).trim())t.pezzi=String(S.acquisti.filter(a=>a.fatturaId===f.id).reduce((s,a)=>s+(a.qta||0),0)||'');rTrasporti()}};
  const save=async()=>{rd();const {c,p}=calc();if(!(c>0))throw new Error('Indica il costo del trasporto (XX).');if(!(p>0))throw new Error('Indica il numero di pezzi (YY).');
    const r=await api('api_saveTrasporto',{id:t.id,data:t.data,descrizione:t.descrizione,fornitore:supplierMatch(t.fornitore),fatturaId:t.fatturaId,costo:c,valuta:t.valuta,cambio:num(t.cambio),pezzi:p,metodo:'pezzi'},[]);
    await reload();return r.id};
  $('#t-save').onclick=e=>busy(e.currentTarget,async()=>{await save();S.tr=newTr();render();toast('Spedizione salvata.')});
  $('#t-apply').onclick=e=>busy(e.currentTarget,async()=>{const id=await save();S.tr=newTr();render();applyTrasporto(id)});
  const nw=$('#t-new');if(nw)nw.onclick=()=>{S.tr=newTr();rTrasporti()};
  calc();
  const L=[...S.trasporti].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  $('#t-tab').innerHTML=L.length?`<table><thead><tr><th>Data</th><th>Riferimento</th><th>Fornitore</th><th class="r">Costo</th><th class="r">Pezzi</th><th class="r">€ / pezzo</th><th class="r">Componenti</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td class="nw">${dmy(x.data)}</td><td><b>${esc(x.descrizione)||'—'}</b>${x.metodo==='valore'?' <span class="chip">per valore</span>':''}</td><td>${esc(x.fornitore)}</td><td class="r nw">${money(x.costo,x.valuta)}</td><td class="r">${fmt(x.pezzi,0,3)}</td><td class="r nw">${x.metodo==='valore'?'<span class="mut">variabile</span>':`<span class="land">${eurP(x.unitario)}</span>`}</td><td class="r">${nrow(x.id)}</td>
    <td class="nw r"><button class="btn sm" data-ed="${x.id}">Modifica</button> ${x.metodo==='valore'?'':`<button class="btn sm y" data-ap="${x.id}">Assegna</button> `}<button class="btn sm d" data-de="${x.id}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nessuna spedizione salvata.</div>';
  $$('#t-tab [data-ed]').forEach(b=>b.onclick=()=>{const x=S.trasporti.find(y=>y.id===b.dataset.ed);S.tr={...x,costo:String(x.costo),pezzi:String(x.pezzi),cambio:x.cambio||''};rTrasporti();window.scrollTo(0,0)});
  $$('#t-tab [data-ap]').forEach(b=>b.onclick=()=>applyTrasporto(b.dataset.ap));
  $$('#t-tab [data-de]').forEach(b=>b.onclick=()=>{const x=S.trasporti.find(y=>y.id===b.dataset.de);if(!confirm('Eliminare la spedizione «'+(x.descrizione||'')+'»? Il trasporto verrà tolto dai '+nrow(x.id)+' componenti collegati.'))return;busy(b,async()=>{await api('api_deleteTrasporto',x.id);await reload();render();toast('Spedizione eliminata.')})});
}
function applyTrasporto(id){
  const t=S.trasporti.find(x=>x.id===id);if(!t)return;
  const rows=[...S.acquisti].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const sel=new Set(rows.filter(a=>a.traspId===id||(t.fatturaId&&a.fatturaId===t.fatturaId&&a.traspIncl!=='SI')).map(a=>a.id));
  const w=modal(`<div class="mh"><h3>Assegna «${esc(t.descrizione)||'spedizione'}» ai componenti</h3><button class="x">${ic('x')}</button></div><div class="mb">
    <div class="res" style="margin:0 0 12px"><div class="f">Costo unitario trasporto<br><b>${eurP(t.unitario)}</b></div><div class="f">= ${money(t.costo,t.valuta)} ÷ ${fmt(t.pezzi,0,3)} pezzi</div></div>
    <div class="search" style="margin-bottom:10px">${ic('search')}<input id="ap-q" placeholder="Cerca componente, fornitore, codice…" style="width:100%"></div>
    <div class="pk" id="ap-l"></div><div id="ap-i" class="note" style="margin:12px 0 0"></div></div>
    <div class="mf"><button class="btn x">Annulla</button><button class="btn p" id="ap-ok">Assegna ai selezionati</button></div>`,'m');
  closeX(w);
  const info=()=>{const n=rows.filter(a=>sel.has(a.id)).reduce((s,a)=>s+(a.qta||0),0);$('#ap-i',w).className='note'+(Math.abs(n-t.pezzi)<0.001?' ok':'');$('#ap-i',w).textContent=`${sel.size} righe selezionate · ${fmt(n,0,3)} pezzi (la spedizione è di ${fmt(t.pezzi,0,3)} pezzi)`};
  const draw=()=>{const q=norm($('#ap-q',w).value).split(' ').filter(Boolean);
    const a=rows.filter(r=>sel.has(r.id)||!q.length||q.every(x=>norm([r.codice,r.nome,r.fornitore].join(' ')).includes(x))).slice(0,150);
    $('#ap-l',w).innerHTML=`<table><tbody>${a.map(r=>`<tr><td style="width:30px"><input type="checkbox" data-id="${r.id}" ${sel.has(r.id)?'checked':''}></td><td><b>${esc(r.nome||r.codice)}</b><div class="mut" style="font-size:12px">${esc(r.fornitore)} · ${esc(r.codice)} · ${dmy(r.data)}</div></td><td class="r nw">${fmt(r.qta,0,3)} pz<div class="mut" style="font-size:12px">${r.traspIncl==='SI'?'trasp. incluso':(r.trasporto!=null?'trasp. '+eurP(r.trasporto):'—')}</div></td></tr>`).join('')}</tbody></table>`;info()};
  $('#ap-q',w).oninput=draw;$('#ap-l',w).addEventListener('change',e=>{const c=e.target;if(c.dataset.id){c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);info()}});draw();
  $('#ap-ok',w).onclick=e=>busy(e.currentTarget,async()=>{if(!sel.size)throw new Error('Seleziona almeno una riga.');
    const r=await api('api_saveTrasporto',{...t},[...sel]);w.remove();await reload();render();toast('Trasporto '+eurP(t.unitario)+' assegnato a '+r.righe+' righe: costo landed aggiornato.')});
}

/* ============ Distinte base ============ */
function rDistinte(){
  head('Distinte base','Conto economico: materiali + costi variabili + lavoro + quota costi fissi = costo prodotto · poi prezzo e margine',`<button class="btn p" id="p-new">${ic('plus')}Nuova distinta</button>`);
  $('#view').innerHTML=`<div class="split"><div class="card"><div style="padding:10px"><div class="search">${ic('search')}<input id="p-q" placeholder="Cerca prodotto…" value="${esc(S.pq)}" style="width:100%"></div></div><div class="plist" id="p-list"></div></div><div id="p-ed"></div></div>`;
  $('#p-new').onclick=()=>selProd(null,true);$('#p-q').oninput=e=>{S.pq=e.target.value;pList()};
  pList();pEditor();
}
function pList(){
  const t=norm(S.pq),a=S.prodotti.filter(p=>!t||norm(p.nome+' '+p.codice).includes(t)).sort((x,y)=>x.nome.localeCompare(y.nome));
  $('#p-list').innerHTML=a.length?a.map(p=>{const T=prodTotals(p);return `<button data-id="${p.id}" class="${S.prodId===p.id?'on':''}"><b>${esc(p.nome)}</b><br><small>${esc(p.codice)||'—'} · costo ${eur(T.tot)}</small></button>`}).join(''):`<div class="empty">${S.prodotti.length?'Nessun risultato.':'Nessuna distinta: creane una.'}</div>`;
  $$('#p-list button').forEach(b=>b.onclick=()=>selProd(b.dataset.id));
}
function selProd(id,isNew){
  if(S.pDirty&&!confirm('Hai modifiche non salvate: abbandonarle?'))return;
  S.prodId=isNew?'__new':id;S.pDirty=false;
  S.pEdit=isNew?{id:'',codice:'',nome:'',descrizione:'',bom:[],variabili:[],lavoro:[],fissi:[],prezzoVendita:'',note:''}:JSON.parse(JSON.stringify(S.prodotti.find(p=>p.id===id)));S.pEdit.variabili=S.pEdit.variabili||[];S.pEdit.fissi=S.pEdit.fissi||[];
  pList();pEditor();
}
function pEditor(){
  const el=$('#p-ed');if(!el)return;const p=S.pEdit;
  if(!p){el.innerHTML=`<div class="card empty">Seleziona una distinta a sinistra, oppure creane una nuova.</div>`;return}
  const dirty=()=>{S.pDirty=true;$('#p-save').disabled=false};
  el.innerHTML=`<div class="card pad">
  <div class="grid"><label class="f">Nome prodotto<input id="p-nome" value="${esc(p.nome)}" placeholder="es. Gettoniera KEY39 completa"></label><label class="f">SKU sul sito gettoniere-shop<input id="p-cod" value="${esc(p.codice)}" placeholder="deve coincidere con lo SKU del sito"></label>
  <label class="f" style="grid-column:1/-1">Descrizione / note<input id="p-des" value="${esc(p.descrizione)}"></label></div>
  <div class="sec"><span>Componenti (criterio prezzo: ${CRIT[S.imp.criterio]})</span><span><button class="btn sm" id="p-addc">${ic('plus')}Dal listino</button> <button class="btn sm" id="p-addf">${ic('plus')}Riga libera</button></span></div>
  <div class="tw"><table class="rt"><thead><tr><th>Componente</th><th style="width:80px">Q.tà</th><th class="r" style="width:110px">€ unit.</th><th class="r" style="width:100px">Totale</th><th style="width:30px"></th></tr></thead><tbody id="p-bom"></tbody></table></div>
  <div class="sec"><span>Costi variabili (energia e altri)</span><span><button class="btn sm" id="p-addv">${ic('plus')}Energia</button> <button class="btn sm" id="p-addv2">${ic('plus')}Altro variabile</button></span></div>
  <div class="tw"><table class="rt"><thead><tr><th>Voce</th><th style="width:90px">Quantità (kWh…)</th><th style="width:110px">€ / unità</th><th class="r" style="width:100px">Totale</th><th style="width:30px"></th></tr></thead><tbody id="p-var"></tbody></table></div>
  <div class="sec"><span>MOD – costo del lavoro (separato)</span><button class="btn sm" id="p-addl">${ic('plus')}Voce di lavoro</button></div>
  <div class="tw"><table class="rt"><thead><tr><th>Lavorazione (MOD)</th><th style="width:80px">Ore</th><th style="width:110px">€ / ora</th><th class="r" style="width:100px">Totale</th><th style="width:30px"></th></tr></thead><tbody id="p-lav"></tbody></table></div>
  <div class="sec"><span>Quota costi fissi</span><button class="btn sm" id="p-addfi">${ic('plus')}Quota costi fissi</button></div>
  <div class="tw"><table class="rt"><thead><tr><th>Voce</th><th style="width:150px">Tipo</th><th style="width:110px">Valore</th><th class="r" style="width:100px">Totale</th><th style="width:30px"></th></tr></thead><tbody id="p-fis"></tbody></table></div>
  <div class="sec"><span>Conto economico del prodotto</span></div><div id="p-tot"></div>
  <div class="grid" style="margin-top:14px"><label class="f">Prezzo di vendita (IVA esclusa) €<input id="p-pv" value="${p.prezzoVendita===''||p.prezzoVendita==null?'':esc(String(p.prezzoVendita).replace('.',','))}"></label></div>
  <div class="mg" id="p-mar"></div>
  <div class="tools noprint" style="margin:18px 0 0"><button class="btn p" id="p-save" ${S.pDirty?'':'disabled'}>Salva distinta</button><button class="btn" id="p-dup">Duplica</button><button class="btn" id="p-csv">${ic('dl')}CSV</button><button class="btn" id="p-print">Stampa</button>
  ${p.id?`<button class="btn d" id="p-del" style="margin-left:auto">${ic('trash')}Elimina</button>`:''}</div></div>`;
  const draw=()=>{
    $('#p-bom').innerHTML=p.bom.length?p.bom.map((l,i)=>{const c=lineCost(l);return `<tr><td>${l.k==='free'?`<input data-b="${i}" data-f="label" value="${esc(l.label)}" placeholder="Descrizione riga libera">`:`<b>${esc(l.label)}</b><div class="mut" style="font-size:12px">${c.warn?`<span class="chip warn">${esc(c.info)}</span>`:esc(c.info)}${c.tr>0?` <span class="chip warn">landed: trasporto ${eurP(c.tr)}</span>`:''}</div>`}</td>
      <td><input data-b="${i}" data-f="qta" value="${esc(String(l.qta).replace('.',','))}"></td>
      <td class="r">${l.k==='free'?`<input data-b="${i}" data-f="costo" value="${esc(String(l.costo??'').replace('.',','))}" style="text-align:right">`:eurP(c.u)}</td>
      <td class="r nw" id="bt${i}">${eur(c.u*(num(l.qta)||0))}</td><td><button class="btn sm d" data-bx="${i}" tabindex="-1">${ic('x')}</button></td></tr>`}).join(''):`<tr><td colspan="5" class="mut" style="padding:14px">Nessun componente: aggiungine dal listino.</td></tr>`;
    $('#p-lav').innerHTML=p.lavoro.length?p.lavoro.map((l,i)=>`<tr><td><input data-l="${i}" data-f="desc" value="${esc(l.desc)}" placeholder="es. Assemblaggio e collaudo"></td><td><input data-l="${i}" data-f="ore" value="${esc(String(l.ore).replace('.',','))}"></td>
      <td><input data-l="${i}" data-f="tariffa" value="${esc(String(l.tariffa).replace('.',','))}"></td><td class="r nw" id="lt${i}">${eur((num(l.ore)||0)*(num(l.tariffa)||0))}</td><td><button class="btn sm d" data-lx="${i}" tabindex="-1">${ic('x')}</button></td></tr>`).join('')
      :`<tr><td colspan="5" class="mut" style="padding:14px">Nessuna voce di lavoro${Number(S.imp.tariffaOraria)?'':' (imposta la tariffa oraria predefinita in Impostazioni)'}.</td></tr>`;
    $('#p-var').innerHTML=p.variabili.length?p.variabili.map((l,i)=>`<tr><td><input data-v="${i}" data-f="desc" value="${esc(l.desc)}" placeholder="es. Energia elettrica"></td><td><input data-v="${i}" data-f="qta" value="${esc(String(l.qta).replace('.',','))}"></td><td><input data-v="${i}" data-f="costo" value="${esc(String(l.costo).replace('.',','))}"></td><td class="r nw" id="vt${i}">${eur((num(l.qta)||0)*(num(l.costo)||0))}</td><td><button class="btn sm d" data-vx="${i}" tabindex="-1">${ic('x')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="mut" style="padding:14px">Nessun costo variabile${Number(S.imp.energiaKwh)?'':' (imposta il costo dell’energia €/kWh in Impostazioni)'}.</td></tr>`;
    $('#p-fis').innerHTML=p.fissi.length?p.fissi.map((l,i)=>`<tr><td><input data-fi="${i}" data-f="desc" value="${esc(l.desc)}" placeholder="es. Quota affitto, utenze, stipendi…"></td><td><select data-fi="${i}" data-f="tipo"><option value="eur" ${l.tipo!=='pct'?'selected':''}>€ per pezzo</option><option value="pct" ${l.tipo==='pct'?'selected':''}>% su materiali+var.+lavoro</option></select></td><td><input data-fi="${i}" data-f="val" value="${esc(String(l.val).replace('.',','))}"></td><td class="r nw" id="ft${i}"></td><td><button class="btn sm d" data-fx="${i}" tabindex="-1">${ic('x')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="mut" style="padding:14px">Nessuna quota di costi fissi.</td></tr>`;

/* giacenza alla data = ultima conta con data <= asOf + movimenti successivi alla conta fino ad asOf */
S.snaps={};S.idata={};
function baseSnap(soc,asOf){return S.stock.inventari.filter(i=>i.societa===soc&&(i.data||'')<=asOf).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.creata||'').localeCompare(a.creata||''))[0]||null}
async function ensureSnap(soc,asOf){
  const st=S.stock;Object.keys(st.righeUltime).forEach(s=>{const u=st.righeUltime[s];if(u&&!S.snaps[u.id])S.snaps[u.id]=u.righe});
  const b=baseSnap(soc,asOf);if(b&&!S.snaps[b.id])S.snaps[b.id]=await api('api_inventarioRighe',b.id);
}
function giacMap(soc,asOf){
  asOf=asOf||'9999-12-31';const st=S.stock,m={},base=baseSnap(soc,asOf),rows=base?(S.snaps[base.id]||[]):[],d0=base?base.data:'',exact=!!base&&base.data===asOf;
  st.articoli.filter(a=>a.societa===soc&&a.attivo!=='NO').forEach(a=>m[a.id]={qta:0,ult:'',costo:null});
  rows.forEach(r=>{const e=m[r.articoloId];if(e){e.qta=Number(r.qta)||0;if(exact)e.costo=Number(r.costo)}});
  st.movimenti.filter(x=>x.societa===soc&&(x.data||'')<=asOf).forEach(x=>{const e=m[x.articoloId];if(!e)return;if((x.data||'')>e.ult)e.ult=x.data;if(!d0||x.data>d0)e.qta+=(x.tipo==='scarico'?-1:1)*(Number(x.qta)||0)});
  return m;
}

const CAT_DEF=['COMPONENTI PER LA FABBRICAZIONE','PRODOTTI FINITI DA VENDERE','IMBALLAGGI','ATTREZZI E UTENSILI DA LAVORO','ATTREZZATURE UFFICIO','AMAZON','CINESI','BRICOMAN','ALTRI','ALESSANDRA PROIETTI'];

const tipoFrom=cat=>/FINIT/i.test(cat)?'finito':/ATTREZZ/i.test(cat)?'attrezzatura':'materia';
function parseInvWb(wb){
  const T=v=>String(v==null?'':v).trim(),out={sheets:[],data:'',totale:null,ignorati:[]};
  const sup=[],dmatch=s=>{const m=String(s).match(/(?:INVENTARIO|MAGAZZINO|SITUAZIONE)(?:\s+MAGAZZINO)?\s+AL\s*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/i);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};
  wb.SheetNames.forEach(n=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true});
    if(/^(sommario|riassunto)/i.test(n)){aoa.forEach(r=>{r.forEach(c=>{if(typeof c==='string'&&!out.data)out.data=dmatch(c)});const lbl=r.map(T).join(' ').toUpperCase();if(/TOTALE\s*A\s*\+\s*B/.test(lbl)){const v=r.find(c=>typeof c==='number');if(v!=null)out.totale=v}else if(/^riassunto/i.test(n)&&!lbl.replace(/[\d.,\s]/g,'')&&r.some(c=>typeof c==='number'))out.totale=r.find(c=>typeof c==='number')});return}
    const hs=aoa.findIndex(r=>r.some(c=>/^fornitore$/i.test(T(c)))&&r.some(c=>/^componente$/i.test(T(c))));
    if(hs>=0){sup.push({n,aoa,hs});return}
    const hi=aoa.findIndex(r=>r.some(c=>/^nome$/i.test(T(c)))&&r.some(c=>/^quantit/i.test(T(c))));
    if(hi<0||/^(tutti i materiali|rubrica)/i.test(n)){out.ignorati.push(n);return}
    const H=aoa[hi].map(c=>T(c).toUpperCase()),ix=k=>H.findIndex(h=>h.startsWith(k));
    const C={cod:ix('COD'),cat:ix('CATEGORIA'),sub:ix('SOTTO'),nome:ix('NOME'),et:ix('ETICHETTA'),note:ix('NOTE'),q:ix('QUANTIT'),u:ix('VALORE UNIT'),t:ix('VALORE COMPL')};
    let dsheet='';aoa.slice(0,hi).forEach(r=>r.forEach(c=>{if(typeof c==='string'&&!dsheet)dsheet=dmatch(c)}));
    const items=[];
    for(let k=hi+1;k<aoa.length;k++){const r=aoa[k],nome=T(r[C.nome]);if(!nome)continue;
      const get=i=>i<0?'':r[i],nn=[];let qRaw=get(C.q),q=typeof qRaw==='number'?qRaw:num(qRaw);
      if(isNaN(q)||q<0){nn.push('q.tà nel file «'+T(qRaw)+'»');q=1}
      const uR=get(C.u),tR=get(C.t),u=typeof uR==='number'?uR:num(uR),t=typeof tR==='number'?tR:num(tR);let costo=isNaN(u)?0:u;
      if(!isNaN(t)&&(isNaN(u)||Math.abs(q*u-t)>0.02)){costo=q>0?t/q:0;if(!isNaN(u)&&Math.abs(q*u-t)>0.02)nn.push('valore unitario nel file '+fmt(u)+' ≠ totale '+fmt(t)+': usato il totale')}
      const cat=T(get(C.cat))||'SENZA CATEGORIA';
      items.push({sheet:n,cod:T(get(C.cod)),categoria:cat,sottocategoria:T(get(C.sub)),nome,q,costo:Math.round(costo*10000)/10000,tipo:tipoFrom(cat),
        note:[T(get(C.et)),T(get(C.note)),...nn].filter(Boolean).join(' · '),anom:nn.length?nn.join('; '):''})}
    out.sheets.push({nome:n,data:dsheet,items,inc:true});
  });
  if(sup.length){const dash=sup.find(x=>/^dashboard/i.test(x.n)),norm2=x=>String(x).trim().toUpperCase().replace(/\s+/g,' ');
    const rd=x=>{const H=x.aoa[x.hs].map(c=>T(c).toUpperCase()),ix=k=>H.findIndex(h=>h.startsWith(k)),C={f:ix('FORNITORE'),n:ix('COMPONENTE'),q:ix('MAGAZZINO'),u:ix('COSTO UNIT'),t:ix('COSTO TOT')},rows=[];
      for(let k=x.hs+1;k<x.aoa.length;k++){const r=x.aoa[k],nome=T(r[C.n]);if(!nome)continue;rows.push({f:T(r[C.f]),nome,q:r[C.q],u:r[C.u],t:r[C.t]})}return rows};
    const mk=(r,cat,sheet)=>{const nn=[];let q=typeof r.q==='number'?r.q:num(r.q),u=typeof r.u==='number'?r.u:num(r.u),t=typeof r.t==='number'?r.t:num(r.t);
      if(isNaN(q)||q<0){nn.push('q.tà nel file «'+T(r.q)+'»');q=1}let costo=isNaN(u)?0:u;
      if(!isNaN(t)&&(isNaN(u)||Math.abs(q*u-t)>0.02)){costo=q>0?t/q:0;if(!isNaN(u)&&Math.abs(q*u-t)>0.02)nn.push('costo unitario nel file '+fmt(u)+' ≠ totale '+fmt(t)+': usato il totale')}
      return {sheet,cod:'',categoria:cat,sottocategoria:r.f,nome:r.nome,q,costo:Math.round(costo*10000)/10000,tipo:'materia',note:nn.join(' · '),anom:nn.join('; ')}};
    if(dash){const map={};sup.filter(x=>x!==dash).forEach(x=>rd(x).forEach(r=>{map[norm2(r.nome)+'|'+Math.round((num(r.t)||0)*100)]=x.n}));
      const fs=new Set(sup.filter(x=>x!==dash).map(x=>norm2(x.n)));
      out.sheets.push({nome:dash.n+' (componenti, '+(sup.length-1)+' pagine fornitore già incluse)',data:'',inc:true,items:rd(dash).map(r=>mk(r,map[norm2(r.nome)+'|'+Math.round((num(r.t)||0)*100)]||(fs.has(norm2(r.f))?norm2(r.f):'ALTRI'),dash.n))});
      sup.filter(x=>x!==dash).forEach(x=>out.ignorati.push(x.n+' (duplicata in '+dash.n+')'))}
    else sup.forEach(x=>out.sheets.push({nome:x.n,data:'',inc:true,items:rd(x).map(r=>mk(r,norm2(x.n),x.n))}))}
  return out;
}

/* ---- Modello mensile magazzino SRL (valore): inizio, ingressi, uscite, fine mese ---- */
function modelloSRL(sc,st){
  const par=sc.param||{},cm=par.coeffMese||{},sm=(a,f)=>a.reduce((x,r)=>x+f(r),0);
  const R=sc.righe.map(r=>{const c=cm[r.data.slice(0,7)];if(c==null||!(r.coeff>0)||(r.costoUnit!==''&&r.costoUnit!=null))return r;const k=r.imponibile*c;return {...r,coeff:c,costo:k,scarico:r.fonte==='Magazzino SRL'?k:r.scarico}});
  if(!R.length)return null;
  const inv=st.inventari.filter(i=>i.societa==='TULLIO'&&i.data<='2025-12-31').sort((a,b)=>b.data.localeCompare(a.data))[0],apertura=inv?inv.valore:par.inventario||0;
  const acq={...(par.acquisti||{})};st.movimenti.filter(x=>x.societa==='TULLIO'&&x.tipo!=='scarico'&&x.data>'2025-12-31').forEach(x=>{const m=x.data.slice(0,7);acq[m]=(acq[m]||0)+(Number(x.qta)||0)*(Number(x.costo)||0)});
  const mont={};(par.fatturePS||[]).forEach(f=>f.righe.filter(r=>r.t==='montaggio').forEach(r=>{mont[f.mese]=(mont[f.mese]||0)+r.i}));
  const srlF=par.srlFinale!=null?par.srlFinale:0,vendM=(par.venditaData||'2026-10-31').slice(0,7);
  let mesi=[...new Set([...R.map(r=>r.data.slice(0,7)),...Object.keys(acq),...Object.keys(mont),vendM])].sort();
  const out={},mag={};mesi.forEach(m=>{mag[m]=sum_(R.filter(r=>r.data.slice(0,7)===m&&r.fonte==='Magazzino SRL'),r=>r.scarico)});
  function sum_(a,f){return a.reduce((x,r)=>x+f(r),0)}
  const acqT=sum_(mesi,m=>acq[m]||0),scT=sum_(mesi,m=>mag[m]),montT=sum_(mesi,m=>mont[m]||0);
  const trasf={...(par.trasferimenti||{})};
  if(!Object.keys(trasf).length){const T=Math.round((apertura+acqT-scT-montT-srlF)*100)/100;let done=0;
    (par.fatturePS||[]).forEach(f=>{const r=f.righe.filter(x=>x.t==='recupero').reduce((x,y)=>x+y.i,0);if(r){trasf[f.mese]=(trasf[f.mese]||0)+r;done+=r}});
    trasf[vendM]=(trasf[vendM]||0)+Math.round((T-done)*100)/100}
  let run=apertura;mesi.forEach(m=>{const e={ap:run,ing:acq[m]||0,usV:mag[m],usT:trasf[m]||0,usM:mont[m]||0,usF:m===vendM?srlF:0};e.fine=e.ap+e.ing-e.usV-e.usT-e.usM-e.usF;run=e.fine;out[m]=e});
  return {mesi,M:out,apertura,inv,trasf};
}

  const C={d:ix('DATA'),doc:ix('DOCUMENTO'),cli:ix('CLIENTE'),pa:ix('PAESE'),cod:ix('CODICE'),des:ix('DESCRIZIONE'),q:ix('Q.TÀ'),imp:ix('IMPONIBILE'),cat:ix('CATEGORIA'),fon:ix('FONTE'),cu:ix('COSTO UNITARIO'),co:ix('COEFFICIENTE'),cm:ix('COSTO MATERIALE'),sc:ix('DA SCARICARE'),no:ix('NOTA')};

  const T=v=>String(v==null?'':v).trim(),N=v=>{const x=typeof v==='number'?v:num(v);return isNaN(x)?0:x};
  const ymd=v=>{if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10)}const m=T(v).match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''};
  const righe=[];for(let k=1;k<aoa.length;k++){const r=aoa[k],d=ymd(r[C.d]);if(!d)continue;
    righe.push({data:d,documento:T(r[C.doc]),cliente:T(r[C.cli]),paese:T(r[C.pa]),codice:T(r[C.cod]),descrizione:T(r[C.des]),qta:N(r[C.q]),imponibile:N(r[C.imp]),categoria:T(r[C.cat]),fonte:T(r[C.fon]),
      costoUnit:C.cu>=0&&T(r[C.cu])!==''?N(r[C.cu]):'',coeff:N(r[C.co]),costo:N(r[C.cm]),scarico:N(r[C.sc]),nota:T(r[C.no])})}

  $('#view').innerHTML=`<div class="note">Il <b>coefficiente</b> trasforma il ricavo imponibile delle vendite in <b>costo scaricato dal magazzino SRL</b> (scarico = imponibile × coefficiente). Finché il mese è aperto puoi correggerlo e gli importi si aggiornano subito; con <b>«Chiudi mese»</b> il coefficiente e il magazzino di fine mese vengono fissati e non sono più modificabili${adm?' (solo l’amministratore può riaprire)':''}. I mesi si chiudono in ordine.</div>
   ${prec.length?`<div class="tools noprint" style="margin:0 0 10px"><button class="btn" id="cf-bulk">Chiudi tutti i mesi precedenti a ${meseLbl(oggiM)} (${prec.length})</button></div>`:''}

   <p class="mut" style="font-size:13px;margin:8px 2px">Le righe con costo preso dalla distinta non usano il coefficiente. «Da file vendite» = coefficiente del file importato (non ancora impostato a mano). Il coefficiente che modifichi qui vale anche in «Scarichi e analisi mensile», nel riepilogo di Inventario e nei PDF.</p>`;
  $$('#view input.cf').forEach(i=>i.onchange=async()=>{const m=i.dataset.m,v=num(i.value);if(isNaN(v)||v<=0||v>100){toast('Coefficiente non valido (da 0 a 100 %).',true);drawCoeff();return}

    busy(b,async()=>{const p={...par};p.coeffMese={...(p.coeffMese||{}),[m]:eff};p.mesiChiusi={...(p.mesiChiusi||{}),[m]:{data:todayYmd(),coeff:eff,scarico:x.usV,fine:x.fine,utente:S.me.nome}};await save(p);toast(meseLbl(m)+' chiuso.')})});

/* ============ CATALOGO PRODOTTI IN VENDITA (da valorizzare a poco a poco) ============ */
const STATI={published:'In vendita',hidden:'Nascosto','not-for-sale':'Non in vendita','':'—'};
const STCH={published:'dn',hidden:'warn','not-for-sale':'up','':''};
S.cat=null;S.cq='';S.cstato='';S.cval='';S.ccat='';S.cclosed={};
async function loadCat(force){if(S.cat&&!force)return S.cat;S.cat=await api('api_catalogoState');return S.cat}
function costoCat(r){const c=S.cat.costi[String(r.sku).toLowerCase()];if(c)return {v:c.tot,src:'distinta',ok:c.ok};if(r.costo!=null)return {v:Number(r.costo),src:'manuale',ok:true};return null}
function catItems(rows){
  const out=[];let prev=null;const T=v=>String(v==null?'':v).trim();
  rows.forEach(r=>{const sku=T(r.code);if(!sku)return;
    let nome=T(r.product_name_1),cat=T(r.category_1),note='';
    if(!nome){nome=T(r.variant_name_1);note='Variante'+(prev?' di '+prev.sku:'')}
    if(!cat&&note&&prev)cat=prev.categoria+(prev.sottocategoria?' > '+prev.sottocategoria:'');
    const p=cat.split('>').map(s=>s.trim()).filter(Boolean);
    const it={sku,nome,categoria:p[0]||'Senza categoria',sottocategoria:p.slice(1).join(' > '),descrizione:T(r.meta_description_1)||T(r.short_description_1),
      prezzoIvato:Number(r.price_1)||0,iva:T(r.vat_rate)===''?22:Number(r.vat_rate),promoIvato:Number(r.price_1_special)||0,stato:T(r.state),note};
    out.push(it);prev=it});
  return out;
}
async function rCatalogo(){
  head('CATALOGO PRODOTTI','Tutti i prodotti in vendita, per categoria, con prezzo imponibile · da valorizzare a poco a poco',
    `<button class="btn" id="k-imp">${ic('up')}Importa export negozio (.xlsx)</button> <button class="btn" id="k-csv">${ic('dl')}CSV</button><input type="file" id="k-file" accept=".xlsx,.xls,.csv" class="hide">`);
  $('#view').innerHTML='<div class="empty"><span class="spin"></span> Caricamento catalogo…</div>';
  try{await loadCat()}catch(e){$('#view').innerHTML='<div class="note bad">'+esc(e.message)+'</div>';return}
  if(S.tab!=='catalogo')return;
  $('#k-imp').onclick=()=>$('#k-file').click();
  $('#k-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const items=catItems(rows);if(!items.length)throw new Error('Nessun prodotto riconosciuto: manca la colonna "code".');
      if(!confirm('Importare/aggiornare '+items.length+' prodotti?\nI costi e le note già inseriti restano; vengono aggiornati nomi, categorie, descrizioni e prezzi.'))return;
      const r=await api('api_importaCatalogo',items);await loadCat(true);drawCat();toast('Catalogo aggiornato: '+r.creati+' nuovi, '+r.aggiornati+' aggiornati ('+r.totale+' totali).')}catch(err){toast(err.message,true)}};
  $('#k-csv').onclick=()=>{const c=S.cat;csv([['Codice','Prodotto','Categoria','Sottocategoria','Descrizione','Stato','Prezzo IVA incl. €','IVA %','Imponibile €','Imponibile promo €','Costo prodotto €','Fonte costo','Margine €','Margine %'],
    ...c.righe.map(r=>{const k=costoCat(r);const m=k?r.imponibile-k.v:null;return [r.sku,r.nome,r.categoria,r.sottocategoria,r.descrizione,STATI[r.stato]||r.stato,cn(r.prezzoIvato),r.iva,cn(r.imponibile),cn(r.promoImponibile),k?cn(k.v):'',k?k.src:'',m==null?'':cn(m),m==null||!r.imponibile?'':cn(m/r.imponibile*100)]})],'catalogo_prodotti_'+todayYmd()+'.csv')};
  drawCat();
}
function drawCat(){
  const c=S.cat,all=c.righe;
  if(!all.length){$('#view').innerHTML='<div class="card pad"><div class="empty">Il catalogo è vuoto.<br>Clicca <b>Importa export negozio (.xlsx)</b> in alto e scegli il file esportato dal negozio.</div></div>';return}
  const tt=norm(S.cq).split(' ').filter(Boolean);
  const val=r=>!!costoCat(r);
  const list=all.filter(r=>(!S.cstato||r.stato===S.cstato)&&(!S.ccat||r.categoria===S.ccat)&&(!S.cval||(S.cval==='v'?val(r):!val(r)))&&(!tt.length||tt.every(w=>norm(r.sku+' '+r.nome+' '+r.categoria+' '+r.sottocategoria).includes(w))));
  const nV=all.filter(val).length;const mm=all.filter(val).map(r=>{const k=costoCat(r);return r.imponibile>0?(r.imponibile-k.v)/r.imponibile:null}).filter(x=>x!=null);
  const kp=(l,v,y)=>`<div class="kpi card"><small>${l}</small><b ${y?'style="background:#FFD500;color:#0A0A0A;padding:0 6px;border-radius:6px"':''}>${v}</b></div>`;
  const cats=[...new Set(all.map(r=>r.categoria))].sort((a,b)=>a.localeCompare(b,'it'));
  const groups={};list.forEach(r=>{const k=r.categoria+'\u0001'+r.sottocategoria;(groups[k]=groups[k]||[]).push(r)});
  const keys=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'it'));
  let lastCat='',body='';
  keys.forEach(k=>{const [cat,sub]=k.split('\u0001'),rows=groups[k].sort((a,b)=>a.sku.localeCompare(b.sku,'it',{numeric:true})),closed=S.cclosed[k];
    if(cat!==lastCat){lastCat=cat;const nc=list.filter(r=>r.categoria===cat);body+=`<tr class="grp"><td colspan="7" style="background:#0A0A0A;color:#FFD500;font-weight:900;text-transform:uppercase;letter-spacing:.4px">${esc(cat)} <span style="font-weight:600;opacity:.75">· ${nc.length} prodotti · ${nc.filter(val).length} valorizzati</span></td></tr>`}
    body+=`<tr class="grp" data-g="${esc(k)}" style="cursor:pointer"><td colspan="7" style="background:var(--brand-soft);font-weight:800">${closed?'▸':'▾'} ${esc(sub||'(senza sottocategoria)')} <span class="mut" style="font-weight:600">· ${rows.length} · ${rows.filter(val).length} valorizzati</span></td></tr>`;
    if(!closed)rows.forEach(r=>{const co=costoCat(r),m=co?r.imponibile-co.v:null;
      body+=`<tr class="click" data-s="${esc(r.sku)}"><td class="nw"><b>${esc(r.sku)}</b></td><td><b>${esc(r.nome)}</b>${r.descrizione?`<div class="mut" style="font-size:12.5px;max-width:520px">${esc(r.descrizione.length>130?r.descrizione.slice(0,127)+'…':r.descrizione)}</div>`:''}</td>
        <td><span class="chip ${STCH[r.stato]||''}">${STATI[r.stato]||esc(r.stato)}</span></td>
        <td class="r nw"><b>${eur(r.imponibile)}</b>${r.promoImponibile?`<div class="mut" style="font-size:11.5px">promo ${eur(r.promoImponibile)}</div>`:''}</td>
        <td class="r nw">${co?`<span class="land">${eur(co.v)}</span><div class="mut" style="font-size:11.5px">${co.src}${co.ok?'':' · incompleta'}</div>`:'<span class="chip warn">da valorizzare</span>'}</td>
        <td class="r nw">${m==null?'<span class="mut">—</span>':`<b style="${m<0?'color:#D90000':''}">${eur(m)}</b><div class="mut" style="font-size:11.5px">${r.imponibile>0?fmt(m/r.imponibile*100,1,1)+'%':''}</div>`}</td>
        <td class="nw r">${S.cat.costi[r.sku.toLowerCase()]?'':`<button class="btn sm y" data-nd="${esc(r.sku)}">Crea distinta</button>`}</td></tr>`})});
  $('#view').innerHTML=`<div class="kpis">${kp('Prodotti',all.length)}${kp('In vendita',all.filter(r=>r.stato==='published').length)}${kp('Valorizzati',nV+' / '+all.length,1)}${kp('Da valorizzare',all.length-nV)}${kp('Margine medio',mm.length?fmt(mm.reduce((s,x)=>s+x,0)/mm.length*100,1,1)+'%':'—')}</div>
  <div class="tools"><div class="search">${ic('search')}<input id="k-q" placeholder="Cerca codice, prodotto o categoria…" value="${esc(S.cq)}"></div>
    <select id="k-c"><option value="">Tutte le categorie</option>${cats.map(x=>`<option ${S.ccat===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <select id="k-s"><option value="">Tutti gli stati</option>${Object.entries(STATI).filter(([k])=>k).map(([k,v])=>`<option value="${k}" ${S.cstato===k?'selected':''}>${v}</option>`).join('')}</select>
    <select id="k-v"><option value="">Tutti</option><option value="n" ${S.cval==='n'?'selected':''}>Da valorizzare</option><option value="v" ${S.cval==='v'?'selected':''}>Valorizzati</option></select></div>
  <div class="card tw">${list.length?`<table><thead><tr><th>Codice</th><th>Prodotto</th><th>Stato</th><th class="r">Imponibile €</th><th class="r">Costo prodotto</th><th class="r">Margine</th><th></th></tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">Nessun prodotto corrisponde ai filtri.</div>'}</div>`;
  $('#k-q').oninput=e=>{S.cq=e.target.value;drawCat();const i=$('#k-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  $('#k-c').onchange=e=>{S.ccat=e.target.value;drawCat()};$('#k-s').onchange=e=>{S.cstato=e.target.value;drawCat()};$('#k-v').onchange=e=>{S.cval=e.target.value;drawCat()};
  $$('#view tr.grp[data-g]').forEach(r=>r.onclick=()=>{S.cclosed[r.dataset.g]=!S.cclosed[r.dataset.g];drawCat()});
  $$('#view tr.click').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-nd]'))return;catRow(all.find(x=>x.sku===r.dataset.s))});
  $$('#view [data-nd]').forEach(b=>b.onclick=()=>nuovaDistinta(all.find(x=>x.sku===b.dataset.nd)));
}
function nuovaDistinta(r){
  S.tab='distinte';render();selProd(null,true);
  Object.assign(S.pEdit,{codice:r.sku,nome:r.nome,prezzoVendita:String(r.imponibile).replace('.',',')});S.pDirty=true;pList();pEditor();
  toast('Distinta pre-compilata con codice, nome e prezzo imponibile: aggiungi componenti e salva.');
}
function catRow(r){
  const co=costoCat(r),m=co?r.imponibile-co.v:null;
  const w=modal(`<div class="mh"><h3>${esc(r.sku)}</h3><button class="x">${ic('x')}</button></div><div class="mb">
    <div style="font-weight:800;font-size:16px">${esc(r.nome)}</div><div class="mut" style="margin:4px 0 12px">${esc(r.categoria)}${r.sottocategoria?' › '+esc(r.sottocategoria):''} · <span class="chip ${STCH[r.stato]||''}">${STATI[r.stato]||esc(r.stato)}</span></div>
    ${r.descrizione?`<p style="margin:0 0 12px">${esc(r.descrizione)}</p>`:''}
    <div class="tot" style="margin:0 0 14px"><div><small>Prezzo IVA incl. (${fmt(r.iva,0,1)}%)</small><b>${eur(r.prezzoIvato)}</b></div><div class="big"><small>IMPONIBILE</small><b>${eur(r.imponibile)}</b></div>${r.promoImponibile?`<div><small>Imponibile promo</small><b>${eur(r.promoImponibile)}</b></div>`:''}${m!=null?`<div><small>Margine</small><b>${eur(m)} · ${r.imponibile>0?fmt(m/r.imponibile*100,1,1)+'%':''}</b></div>`:''}</div>
    ${S.cat.costi[r.sku.toLowerCase()]?`<div class="note ok">Costo prodotto <b>${eur(co.v)}</b> calcolato dalla distinta base con questo codice.</div>`:`<div class="grid"><label class="f">Costo prodotto manuale € (finché non esiste la distinta)<input id="c-cos" value="${r.costo==null?'':esc(String(r.costo).replace('.',','))}"></label></div>`}
    <label class="f" style="margin-top:12px">Note<input id="c-note" value="${esc(r.note||'')}"></label></div>
  <div class="mf">${S.cat.costi[r.sku.toLowerCase()]?'':`<button class="btn y" id="c-nd" style="margin-right:auto">Crea distinta base</button>`}<button class="btn x">Chiudi</button><button class="btn p" id="c-ok">Salva</button></div>`);
  closeX(w);const nd=$('#c-nd',w);if(nd)nd.onclick=()=>{w.remove();nuovaDistinta(r)};
  $('#c-ok',w).onclick=e=>busy(e.currentTarget,async()=>{const c=$('#c-cos',w);await api('api_saveCatalogo',{sku:r.sku,costo:c&&c.value.trim()!==''?num(c.value):null,note:$('#c-note',w).value});w.remove();await loadCat(true);drawCat();toast('Salvato.')});
}

/* ============ Avvio ============ */
(async()=>{if(TOKEN){try{await boot();return}catch(e){TOKEN=null}}showLogin()})();
</script>
</body>
</html>
